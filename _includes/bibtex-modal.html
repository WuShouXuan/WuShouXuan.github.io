<div
        class="bibtex-modal"
        id="bibtex-modal"
        hidden
>
    <div
            class="bibtex-modal__backdrop"
            data-bibtex-close
            aria-hidden="true"
    ></div>

    <section
            class="bibtex-modal__dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="bibtex-modal-title"
            aria-describedby="bibtex-modal-description"
    >
        <header class="bibtex-modal__header">
            <div class="bibtex-modal__heading">
        <span class="bibtex-modal__eyebrow">
          Citation export
        </span>

                <h2 id="bibtex-modal-title">
                    BibTeX
                </h2>

                <p
                        class="bibtex-modal__paper-title"
                        id="bibtex-modal-paper-title"
                ></p>
            </div>

            <button
                    class="bibtex-modal__close"
                    type="button"
                    data-bibtex-close
                    aria-label="Close BibTeX dialog"
            >
                <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                >
                    <path d="M6 6l12 12M18 6 6 18"></path>
                </svg>
            </button>
        </header>

        <p
                class="bibtex-modal__description"
                id="bibtex-modal-description"
        >
            Copy this entry and paste it into your bibliography file.
        </p>

        <div class="bibtex-modal__code">
            <div class="bibtex-modal__code-header">
                <span>BibTeX entry</span>

                <span class="bibtex-modal__file-type">
          .bib
        </span>
            </div>

            <textarea
                    class="bibtex-modal__textarea"
                    id="bibtex-modal-text"
                    readonly
                    spellcheck="false"
                    wrap="off"
                    aria-label="BibTeX entry"
            ></textarea>
        </div>

        <footer class="bibtex-modal__footer">
            <p
                    class="bibtex-modal__status"
                    id="bibtex-modal-status"
                    aria-live="polite"
            ></p>

            <div class="bibtex-modal__actions">
                <button
                        class="bibtex-modal__secondary-button"
                        type="button"
                        data-bibtex-close
                >
                    Close
                </button>

                <button
                        class="bibtex-modal__copy-button"
                        id="bibtex-copy-button"
                        type="button"
                >
                    <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                    >
                        <rect
                                x="8"
                                y="8"
                                width="11"
                                height="11"
                                rx="2"
                        ></rect>

                        <path
                                d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
                        ></path>
                    </svg>

                    <span>Copy BibTeX</span>
                </button>
            </div>
        </footer>
    </section>
</div>
